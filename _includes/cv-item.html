<li class="flex flex-col gap-2">
  <div class="flex flex-col gap-x-4">
    <h3 class="font-bold" id="{{ include.id }}">{{ include.title }}</h3>
    <div class="subtitle shrink-0">{{ include.subtitle }}</div>
  </div>
  {% if include.description %}
    <div class="text-muted-foreground">{{ include.description }}</div>
  {% endif %}
  {% if include.link_text %}
    <div>
      <a
        class="text-link underline"
        href="{{ include.link_href | relative_url }}"
      >
        {{- include.link_text -}}
      </a>
    </div>
  {% endif %}
</li>
